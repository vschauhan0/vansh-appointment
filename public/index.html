<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book with Vansh Chauhan</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="avatar">VC</div>
  <div>
    <h1>Vansh Chauhan</h1>
    <p>Freelancer — Book an appointment</p>
  </div>
  <span class="online-dot"><span class="dot"></span> Available</span>
</header>

<div class="layout">

  <!-- Booking Form -->
  <div>
    <div class="card">
      <h2 class="card-title">
        <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Book an appointment
      </h2>

      <div class="field">
        <label>Your name</label>
        <input type="text" id="name" placeholder="Rahul Sharma" autocomplete="name">
      </div>

      <div class="field">
        <label>WhatsApp number</label>
        <div class="phone-row">
          <span class="prefix">+91</span>
          <input type="tel" id="phone" placeholder="9876543210" maxlength="10" inputmode="numeric">
        </div>
      </div>

      <div class="field">
        <label>Date &amp; time</label>
        <input type="datetime-local" id="datetime">
      </div>

      <div class="field">
        <label>Note <span style="text-transform:none;letter-spacing:0;font-weight:400;opacity:0.6">(optional)</span></label>
        <textarea id="note" placeholder="What do you need help with?"></textarea>
      </div>

      <button class="btn" id="submitBtn" onclick="book()">
        Book &amp; send WhatsApp confirmation
      </button>

      <div class="alert" id="alert"></div>
    </div>
  </div>

  <!-- Dashboard -->
  <div>
    <div class="card">
      <div class="dash-top">
        <h2 class="card-title" style="margin-bottom:0">
          <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>
          All appointments
          <span class="count-badge" id="countBadge">0</span>
        </h2>
        <button class="icon-btn" onclick="loadAppointments()">↻ Refresh</button>
      </div>
      <div id="dashboard"><div class="loading">Loading…</div></div>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
